name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7" pytest
      - name: Tests
        run: python -m pytest -v tests
      - name: Self-test from source
        run: python attackshark_battery_tray.pyw --self-test
      - name: Build .exe
        run: python tools/build_exe.py
      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AttackSharkBattery.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test of the .exe failed (exit $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: AttackSharkBattery-exe
          path: dist/AttackSharkBattery.exe
